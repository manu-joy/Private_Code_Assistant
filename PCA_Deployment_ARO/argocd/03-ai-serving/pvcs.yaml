# Persistent Volume Claims for model weight caching.
# Using PVCs avoids re-downloading models on pod restarts (~35GB for Qwen3.6-35B-A3B (MoE)).
# Azure managed-premium (Azure Premium SSD) replaces AWS gp3-csi.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: ai-serving
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-premium
  resources:
    requests:
      storage: 100Gi
